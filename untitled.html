<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع اليد والرسم بالذكاء الاصطناعي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        /* إخفاء عنصر الفيديو الأساسي لأننا هنعرضه جوه الـ Canvas */
        #videoElement {
            display: none; 
        }
        .canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
            border-radius: 10px;
            overflow: hidden;
            /* عكس الشاشة عشان تبان كأنها مراية */
            transform: scaleX(-1); 
        }
        #outputCanvas {
            display: block;
            background-color: #000;
        }
        .controls {
            margin-top: 20px;
            text-align: center;
        }
        button {
            background-color: #00e5ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #00b3cc;
        }
        p { margin-top: 10px; font-size: 18px; color: #ccc; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="canvas-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="outputCanvas" width="800" height="600"></canvas>
    </div>

    <div class="controls">
        <button onclick="clearCanvas()">مسح الشاشة</button>
        <p>✨ ضم صباعك الإبهام والسبابة مع بعض وابدأ ارسم في الهواء ✨</p>
    </div>

    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');

        // مصفوفات لحفظ الخطوط اللي بتترسم
        let paths = [];
        let currentPath = [];
        let isDrawing = false;

        // دالة لمسح الرسم
        function clearCanvas() {
            paths = [];
            currentPath = [];
        }

        // الدالة دي بتشتغل مع كل فريم جاي من الكاميرا
        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // رسم الكاميرا على الـ Canvas
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // بناخد أول إيد تظهر

                // رسم النقط البيضاء على المفاصل زي ما في صورتك بالضبط
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#ffffff', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ffffff', lineWidth: 1, radius: 2});

                // نقطة رقم 8 هي طرف السبابة، ونقطة 4 هي طرف الإبهام
                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];

                // تحويل الإحداثيات لمقاس الشاشة
                const x = indexTip.x * canvasElement.width;
                const y = indexTip.y * canvasElement.height;

                // حساب المسافة بين السبابة والإبهام
                const distance = Math.hypot(indexTip.x - thumbTip.x, indexTip.y - thumbTip.y);

                // لو المسافة قريبة (كأنك ماسك قلم) يبدأ يرسم
                if (distance < 0.05) { 
                    if (!isDrawing) {
                        isDrawing = true;
                        currentPath = [];
                        paths.push(currentPath);
                    }
                    currentPath.push({x, y});
                } else {
                    isDrawing = false;
                }
            } else {
                isDrawing = false;
            }

            // رسم الخطوط المحفوظة (لون لبني فاتح زي الصورة)
            canvasCtx.strokeStyle = 'rgba(0, 229, 255, 0.8)';
            canvasCtx.lineWidth = 8;
            canvasCtx.lineCap = 'round';
            canvasCtx.lineJoin = 'round';

            paths.forEach(path => {
                if (path.length > 1) {
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(path[0].x, path[0].y);
                    for (let i = 1; i < path.length; i++) {
                        canvasCtx.lineTo(path[i].x, path[i].y);
                    }
                    canvasCtx.stroke();
                }
            });

            canvasCtx.restore();
        }

        // إعدادات مكتبة MediaPipe Hands
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.7,
            minTrackingConfidence: 0.7
        });

        hands.onResults(onResults);

        // تشغيل الكاميرا
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 800,
            height: 600
        });
        camera.start();
    </script>
</body>
</html>
